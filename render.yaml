services:
  - type: web
    name: riko
    runtime: node
    plan: free
    region: singapore
    branch: master
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @riko/web build && pnpm --filter @riko/db exec tsx src/migrate.ts
    startCommand: pnpm --filter @riko/api run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RUN_WORKER
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: INBOUND_MAIL_SECRET
        sync: false
      # Shared reply domain; must match the Email Routing zone.
      - key: INBOUND_REPLY_BASE
        sync: false
      # Both must be the service's own public URL once Render assigns it.
      - key: BETTER_AUTH_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: HOLDOUT_PERCENT
        value: "25"
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.1-8b-instruct
